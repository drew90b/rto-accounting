{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header"><h1 class="page-title">{{ title }}</h1></div>
<div class="card" style="max-width:680px;">
  <p>{{ message }}</p>
  <p style="margin-top:12px;">
    {% if link %}<a href="{{ link[0] }}" class="btn btn-primary">{{ link[1] }}</a>{% endif %}
    <a href="/finance/frazer/" class="btn btn-secondary">Back to Frazer Intake</a>
  </p>
</div>
{% endblock %}
