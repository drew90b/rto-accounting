{% extends "base.html" %}
{% block title %}Create snapshot{% endblock %}
{% from "opening_snapshot/_macros.html" import flash %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">Create snapshot</h1>
  <a href="/finance/opening/" class="btn btn-secondary">← Back</a>
</div>
{{ flash(request, error) }}
<div class="card" style="max-width:680px;">
  <form method="post" action="/finance/opening/setup">
    <div class="form-group"><label for="name">Name *</label>
      <input id="name" type="text" name="name" required maxlength="100" value="{{ form.get('name', 'Starting position') }}"></div>
    <div class="form-group"><label for="as_of_date">As-of date *</label>
      <input id="as_of_date" type="date" name="as_of_date" required value="{{ form.get('as_of_date', '') }}"></div>
    <div class="form-group"><label for="label">Label *</label>
      <input id="label" type="text" name="label" required maxlength="50" value="{{ form.get('label', 'Workday 1') }}"></div>
    <div class="form-group"><label for="cutoff_note">Cutoff note</label>
      <input id="cutoff_note" type="text" name="cutoff_note" value="{{ form.get('cutoff_note', 'Unknown') }}">
      <div class="form-hint">When the reported balances were taken, if known. Leave "Unknown" if not.</div></div>
    <button type="submit" class="btn btn-primary">Create snapshot</button>
  </form>
</div>
{% endblock %}
