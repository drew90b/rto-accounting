<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — RTO Accounting</title>
  <link rel="stylesheet" href="/static/css/style.css?v=3">
</head>
<body>
<main class="main" style="max-width:380px;margin:60px auto;">
  <div class="card">
    <h1 class="page-title">RTO Accounting</h1>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="form-group" style="margin-top:12px;">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:16px;">Sign in</button>
    </form>
  </div>
</main>
</body>
</html>
