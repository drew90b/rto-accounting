{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}

<div class="page-header">
  <h1 class="page-title">Change Password</h1>
</div>

{% if forced %}<div class="alert alert-error">You must choose a new password before you continue.</div>{% endif %}
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

<div class="card" style="max-width:420px;">
  <form method="post" action="/account/password">
    <div class="form-group">
      <label for="current_password">Current password</label>
      <input id="current_password" type="password" name="current_password" autocomplete="current-password" required>
    </div>
    <div class="form-group" style="margin-top:12px;">
      <label for="new_password">New password (at least 12 characters)</label>
      <input id="new_password" type="password" name="new_password" autocomplete="new-password" minlength="12" required>
    </div>
    <div class="form-group" style="margin-top:12px;">
      <label for="confirm_password">Repeat new password</label>
      <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" minlength="12" required>
    </div>
    <button type="submit" class="btn btn-primary" style="margin-top:16px;">Change password</button>
  </form>
</div>
{% endblock %}
